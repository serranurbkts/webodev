<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --ana-yesil: #2d5a27;
            --koyu: #212529;
            --arka-plan: #f8f9fa;
        }

        body {
            background-color: var(--arka-plan);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar { 
            background-color: var(--koyu) !important; 
            border-bottom: 4px solid var(--ana-yesil);
        }

        /* Login Kartı - cv-card yapısıyla uyumlu */
        .login-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
        }

        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #ddd;
        }

        .form-control:focus {
            border-color: var(--ana-yesil);
            box-shadow: 0 0 0 0.25rem rgba(45, 90, 39, 0.15);
        }

        .btn-login {
            background-color: var(--ana-yesil);
            color: white;
            border-radius: 50px;
            padding: 12px;
            border: none;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
        }

        .btn-login:hover {
            background-color: var(--koyu);
            color: white;
        }

        .footer-full {
            background-color: var(--koyu);
            color: white;
            border-top: 4px solid var(--ana-yesil);
            padding: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Kişisel Web Sitesi</a>
    </div>
</nav>

<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-person-circle fs-1 text-success"></i>
            <h3 class="fw-bold mt-2">Sistem Girişi</h3>
            <p class="text-muted small">Lütfen öğrenci bilgilerinizle giriş yapın.</p>
        </div>

        <form action="login_kontrol.php" method="POST" id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-bold">E-Posta Adresi</label>
                <input type="email" name="email" class="form-control" placeholder="g251210001@sakarya.edu.tr" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Şifre</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Giriş Yap</button>
        </form>
    </div>
</div>

<footer class="footer-full">
    <div class="container">
        <p class="mb-0 small">Sakarya Üniversitesi | Web Teknolojileri Projesi &copy; 2026</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
